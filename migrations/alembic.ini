[alembic]
script_location = migrations
sqlalchemy.url = postgresql://techparts:techparts@localhost:5432/techparts
file_template = python_legacy
testinfra = false
prepend_sys_path = .
version_path = %(here)s/versions
compare_type = false
testinfra = false
skip_if_schema_includes = sg_modules
skip_if_object_is = table, index

[post_write_hooks]
# post_write_hooks có thể được sử dụng để chạy script sau khi tạo migration.
# Ví dụ: các công cụ để kiểm tra sự thay đổi mã hoặc kiểm tra cơ sở dữ liệu bằng cách sử dụng URL kết nối cơ sở dữ liệu.
# hooks được định nghĩa trong config.get_section('post_write_hooks') dưới dạng một dictionary
# kết hợp với `logging.config.dictConfig(hooks['logging_config'])`.
# Các yêu cầu `sqlalchemy.url` để chạy kiểm tra DB.
# Được thiết kế chủ yếu cho Aften.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consoleFile, sqlFile

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = consoleFile
qualname = root

[logger_sqlalchemy]
level = WARN
handlers = sqlFile
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = consoleFile
squalname = alembic

[handler_consoleFile]
type = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[handler_sqlFile]
type = FileHandler
args = ('sql.log', 'a', 'UTF-8')
level = NOTSET
formatter = generic