<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Nhập kho - Admin - TechParts</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
    <div id="main-nav"></div>
    <div class="container">
        <h1>Nhập kho</h1>
        <input type="text" id="note" placeholder="Ghi chú">
        <div id="items-container">
            <div class="item">
                <input type="number" class="pid" placeholder="Product ID">
                <input type="number" class="qty" placeholder="SL">
                <input type="number" class="price" placeholder="Giá nhập">
            </div>
        </div>
        <button id="save-stock-btn">Lưu phiếu nhập</button>
    </div>
    <script type="module" src="/js/admin/stock.js"></script>
</body>
</html>
